services:
  weather-service:
    build: .
    container_name: weather-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
